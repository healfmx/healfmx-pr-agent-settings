# Reference copy of the PR-Agent config every healfmx repo should use.
#
# NOT fetched automatically. `config.config_file` as an env var does not
# pull and merge a remote .pr_agent.toml — verified against a real run's
# debug log (healf-erp-backend PR #277): the URL was stored as a literal
# config value and PR-Agent ran with its built-in default model (gpt-5.6)
# instead of anything below. Copy this file's contents into the consuming
# repo's own root .pr_agent.toml (that mechanism is confirmed working) and
# keep it in sync by hand when this file changes.
#
# Provider: Anthropic Claude, routed through PR-Agent's litellm integration.
# Model choice and cost rationale are tracked outside this repo; short version:
# Claude Sonnet 5 at effort "high" is the default sweet spot for code review
# cost/quality, reserving Opus 5 for critical-path PRs only (see the
# path-based override in [pr_reviewer.extra_instructions] below).

#
# `repo_context_files` is deliberately absent from this reference copy: the
# list is per-repo, since each repo's AGENTS.md layout differs. Each
# consuming repo declares its own, plus `repo_context_max_lines` sized to
# it (the default cap is 500 total lines and truncates silently).

[config]
model = "anthropic/claude-sonnet-5"
fallback_models = ["anthropic/claude-haiku-4-5"]

# Trims the default 3-command bundle down to /review + /improve (drops
# /describe only). /review flags security/logic issues and drives the
# branch-protection gate (`possible security issue` label); /improve adds
# inline, resolvable code-suggestion comments — /review alone can't do that,
# it only posts one summary comment. Two model calls per PR instead of one;
# at current volume (~81 PRs/mes) that's Sonnet 5 effort-high ~$464 MXN/mes
# instead of ~$232 MXN/mes — approved, still trivial next to a seat-based tool.
pr_commands = ["/review", "/improve"]

# PR-Agent computes real per-run cost via litellm and can post it in the PR
# comment. Use this instead of estimating — measure the pilot week, then
# revisit model/effort choice with real numbers.
output_run_cost = true

[pr_reviewer]
# Default is 3 (docs.pr-agent.ai, verified). A real PR can have more than 3
# genuine findings; the default silently drops the rest. Found smoke-testing
# healf-erp-backend PR #282, where a file breaking 9 AGENTS.md rules only
# surfaced 3 per section.
num_max_findings = 10

# NOTE: PR-Agent's litellm integration does not have a first-class
# "effort"/"thinking" passthrough for Claude at the time this file was
# written. If litellm's `extra_body` passthrough is available in the
# installed PR-Agent version, this is where a request for
# `output_config: {effort: "high"}` would go. Verify against the PR-Agent
# version actually pinned in the reusable workflow before assuming this is
# active — until confirmed, requests run at the model's default effort.
#
# These instructions previously said "do not comment on formatting or style
# already enforced by CI linters". That one line silently disabled a whole
# rule: on a test PR whose file broke four of healf-erp-backend's
# non-negotiables on purpose, the review caught the tenant, logging and
# money violations and missed the Spanish identifiers — the only one of the
# four with a pre-commit hook behind it. All four rules were equally present
# in the loaded context, so this was never a context problem. Do not
# reintroduce a blanket "CI already covers it" exclusion.
extra_instructions = """
The repository's normative rules are the AGENTS.md files given to you as
context. Review the diff against those rules and name the rule you are
invoking — file and number — in every finding, so the author can check it
rather than take your word for it.

Report a rule violation even when a pre-commit hook or a CI job also catches
it. This review runs when the PR is opened, before the author has read CI
output, and several rules with hooks behind them are semantic rather than
cosmetic: English-only identifiers and comments, monetary
Decimal/ROUND_HALF_UP policy, and hand-edited generated artefacts among
them.

Do skip cosmetics that ruff and ruff-format rewrite on their own — line
length, quote style, import order. That is noise, and it is the only
category CI coverage is a reason to stay quiet about.

Priorities, highest first: tenant isolation and cross-tenant reads; PII or
credential exposure, including any value interpolated into a log message,
an exception argument or a cache key; correctness bugs; then the remaining
non-negotiables.

docs/wiki/ is operational truth and wins on conflict, but it is not in your
context. When a change looks like it contradicts or makes a documented
standard stale, say so and name the page — do not guess what the page says.
"""

[github_action_config]
auto_review = true
auto_describe = false
auto_improve = true
