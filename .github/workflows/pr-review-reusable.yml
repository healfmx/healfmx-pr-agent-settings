name: PR Review (reusable)

# Called by consuming repos via:
#   uses: healfmx/healfmx-pr-agent-settings/.github/workflows/pr-review-reusable.yml@main
#
# Centralizes the PR-Agent config, model choice, and the API key so
# individual repos only need a thin caller workflow (see README.md).

on:
  workflow_call:
    secrets:
      ANTHROPIC_API_KEY:
        description: "Anthropic API key used by PR-Agent for automated review."
        required: true

permissions: {}

jobs:
  pr-review:
    # Release PRs (develop -> main) were already reviewed against develop in
    # their original PRs; re-running the bundle here is a full model call
    # that adds noise, not signal. Skip by branch name.
    if: ${{ !startsWith(github.head_ref, 'release/') && github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: PR-Agent review
        # Pinned to The-PR-Agent/pr-agent's main HEAD as of 2026-08-28
        # (`git ls-remote https://github.com/The-PR-Agent/pr-agent.git
        # refs/heads/main`) rather than the floating branch, so an upstream
        # push can't change what runs here without a deliberate bump.
        #
        # Model/commands/cost-tracking config is NOT centralized here.
        # `config.config_file` as an env var does not fetch and merge a
        # remote .pr_agent.toml — verified against a real run's debug log
        # (healf-erp-backend PR #277): the URL was stored as a literal
        # config value and PR-Agent ran with its built-in default model
        # instead. Each consuming repo carries its own full .pr_agent.toml
        # at its root (the one confirmed-working config mechanism); see
        # .pr_agent.toml in this repo for the reference copy.
        uses: The-PR-Agent/pr-agent@c27c0ef4a79218ffb4f3fbe6b8934f19fa4fdcf0 # main, 2026-08-28
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
